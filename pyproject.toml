[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "interview-starter"
version = "0.1.0"
description = "FastAPI, PostgreSQL, Weaviate, and OpenAI interview starter"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "weaviate-client>=4.16.4,<5",
    "openai>=2,<3",
    "pydantic-settings>=2.7,<3",
    "pillow>=11,<13",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "httpx>=0.28,<1",
    "ruff>=0.11,<1",
    "pre-commit>=4.4,<5",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = ["integration: requires a running Docker Compose stack"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
show_missing = true
