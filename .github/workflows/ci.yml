name: Checks

on: [push, pull_request]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make check pre-commit

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make integration
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
