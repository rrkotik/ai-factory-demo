minimum_pre_commit_version: "4.4.0"
default_stages: [pre-commit]

# Use the Ruff version from uv.lock, already installed in the Docker image.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: ruff check --fix --force-exclude
        language: unsupported
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: Ruff format
        entry: ruff format --force-exclude
        language: unsupported
        types_or: [python, pyi]
        require_serial: true
